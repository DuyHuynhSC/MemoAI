<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- M Symbol Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Subtitle Bar 1 Gradient (Primary) -->
    <linearGradient id="sub1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtitle Bar 2 Gradient (Secondary) -->
    <linearGradient id="sub2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="64" y="64" width="896" height="896" rx="210" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Inner Soft Subtitle Card / Screen -->
  <rect x="156" y="156" width="712" height="712" rx="140" fill="#0F172A" fill-opacity="0.35" />

  <!-- The "M" Logo (MemoAI) -->
  <!-- Left Leg -->
  <rect x="260" y="270" width="88" height="340" rx="44" fill="url(#mGrad)" />
  <!-- Right Leg -->
  <rect x="676" y="270" width="88" height="340" rx="44" fill="url(#mGrad)" />
  
  <!-- Center Chevron / Peak of M -->
  <path d="M 304 330 
           L 512 550 
           L 720 330 
           L 720 430 
           L 512 640 
           L 304 430 Z" 
        fill="url(#mGrad)" />

  <!-- Floating Center Accent Core (AI Audio Dot) -->
  <circle cx="512" cy="400" r="36" fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- Bilingual Subtitle Bars (Audio / Subtitle Visualizer) -->
  <!-- Line 1 (Japanese / Source) -->
  <rect x="250" y="680" width="340" height="36" rx="18" fill="url(#sub1Grad)" />
  <rect x="614" y="680" width="160" height="36" rx="18" fill="url(#sub1Grad)" />

  <!-- Line 2 (Vietnamese / Translation) -->
  <rect x="250" y="744" width="220" height="28" rx="14" fill="url(#sub2Grad)" opacity="0.95" />
  <rect x="494" y="744" width="280" height="28" rx="14" fill="url(#sub2Grad)" opacity="0.95" />

  <!-- AI Sparkle Star (Top Right) -->
  <g transform="translate(730, 210)" filter="url(#glow)">
    <path d="M 0 -64 
             C 0 -16, 16 0, 64 0 
             C 16 0, 0 16, 0 64 
             C 0 16, -16 0, -64 0 
             C -16 0, 0 -16, 0 -64 Z" 
          fill="url(#sparkleGrad)" />
  </g>
</svg>
